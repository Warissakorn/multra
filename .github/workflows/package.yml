name: Package binaries

# Produces downloadable builds for manual testing. Run it from the Actions tab
# (Run workflow), or push a v* tag. Artifacts are kept for 14 days.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build nlohmann-json3-dev qt6-base-dev libproj-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --parallel 2
      - name: Test
        run: ctest --preset release --parallel 4
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stage install tree
        run: |
          cmake --install build/release --prefix dist
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/
          # Licence texts and the copyright files of what is compiled in or shipped (D285).
          mkdir -p dist/licenses
          cp licenses/*.txt dist/licenses/
          cp /usr/share/doc/libproj-dev/copyright dist/licenses/proj-copyright.txt
          cp /usr/share/doc/nlohmann-json3-dev/copyright dist/licenses/nlohmann-json-copyright.txt
          cat > dist/RUN.txt <<'EOF'
          MULTRA - Linux build (not a self-contained bundle)

          Requires Qt 6 Widgets runtime on the machine, e.g. on Ubuntu 24.04:
              sudo apt install libqt6widgets6t64 libqt6network6t64 libproj25

          Run the desktop editor:
              ./bin/multra-desktop
              ./bin/multra-desktop --language th
              ./bin/multra-desktop --scenario data/scenarios/crossing.json
          Run the headless CLI with a seed:
              ./bin/multra-cli 42

          Results are NOT yet validated against field or reference data.
          EOF
      - uses: actions/upload-artifact@v6
        with:
          name: multra-linux-x86_64
          path: dist/
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        # This action's latest major is v4; there is no v5. Do not bump it alongside the
        # actions/* steps - a blanket major bump broke packaging in 26d7399.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true
      - name: Install JSON headers
        # Header-only, so vcpkg has no DLL to copy beside each binary; its per-target copy step
        # (applocal) is off because parallel targets raced on it (package run 68, exit 32).
        run: |
          vcpkg install nlohmann-json:x64-windows proj:x64-windows
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Thai line breaking
        # Qt 6.5 finds Thai line breaks through libthai, loaded at run time as thai.dll, as in the
        # native workflow (D245). The build ships it; the editor points libthai at data/libthai.
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-libthai
          $thai = "$env:GITHUB_WORKSPACE\libthai"
          New-Item -ItemType Directory -Force $thai | Out-Null
          Copy-Item C:\msys64\ucrt64\bin\libthai-0.dll "$thai\thai.dll"
          Copy-Item C:\msys64\ucrt64\bin\libdatrie-1.dll, C:\msys64\ucrt64\share\libthai\thbrk.tri $thai
          $thai | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "LIBTHAI_DICTDIR=$thai" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_APPLOCAL_DEPS=OFF
      - name: Build
        run: cmake --build build/native --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure --parallel 4
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stage install tree
        run: |
          cmake --install build/native --config Release --prefix dist
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.md dist/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" dist/bin/
          Copy-Item libthai/thai.dll, libthai/libdatrie-1.dll dist/bin/
          New-Item -ItemType Directory -Force dist/bin/data/libthai, dist/licenses/vcpkg | Out-Null
          Copy-Item libthai/thbrk.tri dist/bin/data/libthai/
          # Licence texts (LGPL for Qt, libthai, libdatrie) and every vcpkg port's copyright file,
          # since their DLLs and proj.db ship here (D285).
          Copy-Item licenses/*.txt dist/licenses/
          $ports = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/*/copyright"
          if (-not $ports) { throw "No vcpkg copyright files found" }
          foreach ($file in $ports) { Copy-Item $file.FullName "dist/licenses/vcpkg/$($file.Directory.Name).txt" }
          foreach ($name in 'libthai', 'libdatrie') {
            if (Test-Path "C:/msys64/ucrt64/share/licenses/$name") { Copy-Item -Recurse "C:/msys64/ucrt64/share/licenses/$name" dist/licenses/ }
            else { Write-Warning "$name ships no licence folder; LGPL-2.1.txt and THIRD-PARTY-NOTICES.md cover it" }
          }
      - name: Bundle Qt runtime
        run: windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/bin/multra-desktop.exe
      - name: Write run notes
        run: |
          @'
          MULTRA - Windows x64 build (Qt runtime bundled)

          Run the desktop editor:
              bin\multra-desktop.exe
              bin\multra-desktop.exe --language th
              bin\multra-desktop.exe --scenario data\scenarios\crossing.json
          Run the headless CLI with a seed:
              bin\multra-cli.exe 42

          Results are NOT yet validated against field or reference data.
          '@ | Set-Content dist/RUN.txt
      - uses: actions/upload-artifact@v6
        with:
          name: multra-windows-x64
          path: dist/
          retention-days: 14
